# Builds a signed Android App Bundle (.aab) to upload to Google Play.
# Run it from Actions > Android release > Run workflow (or push a tag like v1.0.0).
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   your upload keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (for example: upload)
#   ANDROID_KEY_PASSWORD      key password
# and this repository variable (not secret): ADMOB_APP_ID (your real AdMob app id).
name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name shown to players, for example 1.0.0'
        required: true
        default: '1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ashen-vigil
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first (see APP.md)."; exit 1; fi
      - name: Install and sync web build
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          export BUILD_NUMBER=$((1000 + BUILD_NUMBER))
          cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-vigil-release-${{ github.run_number }}
          path: ashen-vigil/android/app/build/outputs/bundle/release/app-release.aab
