# Publishes the web version of Ashen Vigil to GitHub Pages on every push that
# touches the game. One-time setup: Settings > Pages > Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main, ccr-cc5bee01-bpu6a0]
    paths: ['ashen-vigil/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build website
        working-directory: ashen-vigil
        run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ashen-vigil/web
      - id: deployment
        uses: actions/deploy-pages@v4
